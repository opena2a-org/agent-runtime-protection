name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Skip if this version is already published
        id: published
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "arp-guard@${version}" version >/dev/null 2>&1; then
            echo "arp-guard@${version} is already on npm; skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with provenance
        if: steps.published.outputs.skip == 'false'
        run: npm publish --provenance --access public

      - name: Verify provenance on npm
        run: |
          version=$(node -p "require('./package.json').version")
          deadline=$((SECONDS + 300))
          while [ $SECONDS -lt $deadline ]; do
            attestations=$(npm view "arp-guard@${version}" dist.attestations --json 2>&1 || true)
            if [ -n "$attestations" ] && [ "$attestations" != "null" ] && [ "$attestations" != "{}" ]; then
              echo "Provenance verified for arp-guard@${version}"
              exit 0
            fi
            echo "Attestations not yet visible, retrying in 15s... (elapsed ${SECONDS}s)"
            sleep 15
          done
          echo "::error::Provenance attestations missing from npm for arp-guard@${version} after 5 minutes"
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.4.1
        with:
          generate_release_notes: true
